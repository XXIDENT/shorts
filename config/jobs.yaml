# 'AI 신입 모니의 직업체험' 에피소드 대본.
#
# 편마다 직접 쓴다(템플릿 반복 금지: 유튜브 대량생산 콘텐츠 정책).
# - scene: shorts/pixel/scenes.py의 무대 이름
# - quests: 2~3개. say(1~2줄) → result(clear|fail) → after(결과 한 줄)
#   spot: 모니가 설 자리, pose: work|idle|wave, face: normal|focus|happy|sad|shock|smug|love|dizzy
#   fx: 진행 중 효과, fx_after: 결과 효과, props: 이 퀘스트에만 나오는 소품, npc: false면 손님 없음
# - data: Frey & Osborne(2013) 부록의 실제 확률(prob)과 원래 직업명(occupation), 화면용 이름(label)
# - verdict: 모니의 체감 대체 가능도(%), 캐릭터 의견이라고 설명에 밝힌다
# - draft: true면 아직 안 올림

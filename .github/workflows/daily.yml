name: 매일 쇼츠 생성

on:
  schedule:
    # 한국 시간 오전 8시, 오후 6시 (UTC 23시, 9시)
    - cron: "0 23 * * *"
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      topic:
        description: "주제 id (비우면 자동 선택, config/topics.yaml 참고)"
        required: false

permissions:
  contents: write

concurrency:
  group: daily-shorts
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 한글 폰트·FFmpeg 설치
        run: sudo apt-get update -q && sudo apt-get install -y -q fonts-noto-cjk ffmpeg

      - run: pip install -r requirements.txt

      - name: 쇼츠 만들기 (+ Secrets가 있으면 업로드)
        env:
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY: ${{ vars.YT_PRIVACY || 'private' }}
        run: |
          if [ -n "${{ github.event.inputs.topic }}" ]; then
            python -m shorts.main --topic "${{ github.event.inputs.topic }}"
          else
            python -m shorts.main
          fi

      - name: 영상 파일 보관 (Actions 실행 화면에서 다운로드 가능, 14일)
        uses: actions/upload-artifact@v4
        with:
          name: shorts-${{ github.run_id }}
          path: out/*.*
          retention-days: 14

      - name: 만든 주제 기록 저장
        run: |
          git config user.name "shorts-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json
          git commit -m "기록: 쇼츠 생성 $(date -u +%F)" || exit 0
          git pull --rebase
          git push

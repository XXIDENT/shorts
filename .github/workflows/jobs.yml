name: 픽셀 직업체험 쇼츠

on:
  # 예약 실행은 GitHub 지연(최대 몇 시간) 때문에 쓰지 않고, Claude 예약 작업이 정시에 workflow_dispatch로 실행함
  workflow_dispatch:
    inputs:
      job:
        description: "직업 id (비우면 다음 차례, config/jobs.yaml 참고)"
        required: false
      no_upload:
        description: "true면 영상만 만들고 업로드하지 않음"
        required: false
        default: "true"
      lang:
        description: "ko(모니의 하루) 또는 en(영어 채널, MAKE_WEBHOOK_URL_EN 필요)"
        required: false
        default: "ko"
  # 대본이나 그림을 고치는 PR마다 샘플 영상을 만든다 (업로드 안 함)
  pull_request:
    paths:
      - "shorts/jobs.py"
      - "shorts/pixel/**"
      - "config/jobs.yaml"
      - ".github/workflows/jobs.yml"

permissions:
  contents: write

concurrency:
  group: job-shorts-${{ github.event_name }}-${{ github.event.inputs.lang || 'ko' }}
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 픽셀 폰트(Unifont)·FFmpeg 설치
        run: sudo apt-get update -q && sudo apt-get install -y -q fonts-unifont ffmpeg

      - run: pip install -r requirements.txt

      - name: 영상 만들기 (+ 업로드)
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          # 영어 채널은 영어 채널 전용 비밀값만 쓴다(한국어 채널로 잘못 올라가지 않게)
          YT_REFRESH_TOKEN: ${{ github.event.inputs.lang == 'en' && secrets.YT_REFRESH_TOKEN_EN || (github.event.inputs.lang != 'en' && secrets.YT_REFRESH_TOKEN || '') }}
          YT_PRIVACY: ${{ vars.YT_PRIVACY || 'private' }}
          MAKE_WEBHOOK_URL: ${{ github.event.inputs.lang == 'en' && secrets.MAKE_WEBHOOK_URL_EN || (github.event.inputs.lang != 'en' && secrets.MAKE_WEBHOOK_URL || '') }}
          MAKE_PRIVACY: ${{ vars.MAKE_PRIVACY || 'public' }}
          MAKE_IG_WEBHOOK_URL: ${{ github.event.inputs.lang != 'en' && secrets.MAKE_IG_WEBHOOK_URL || '' }}
          SHORTS_LANG: ${{ github.event.inputs.lang || 'ko' }}
          GITHUB_TOKEN: ${{ github.token }}
          JOB: ${{ github.event.inputs.job }}
          NO_UPLOAD: ${{ github.event.inputs.no_upload }}
          # PR 샘플은 짧은 편집(25~30초)으로 미리 만들어 본다. 실제 업로드는 코드의 기본값을 따른다.
          SHORTS_CUT: ${{ github.event_name == 'pull_request' && '1' || '' }}
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ARGS="--no-upload --job ${JOB:-barista}"
          else
            if [ "$NO_UPLOAD" = "true" ]; then ARGS="--no-upload"; fi
            if [ -n "$JOB" ]; then ARGS="$ARGS --job $JOB"; fi
            if [ "$SHORTS_LANG" = "en" ] && [ -z "$MAKE_WEBHOOK_URL" ] && [ "$NO_UPLOAD" != "true" ]; then
              echo "영어 채널 웹훅(MAKE_WEBHOOK_URL_EN)이 없어 업로드 없이 만들기만 해요."
              ARGS="$ARGS --no-upload"
            fi
          fi
          python -m shorts.jobs $ARGS

      - name: 영상 파일 보관 (14일)
        uses: actions/upload-artifact@v4
        with:
          name: job-shorts-${{ github.run_id }}
          path: out/*.*
          retention-days: 14

      - name: 올린 직업 기록 저장
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "shorts-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs_history.json data/en/jobs_history.json 2>/dev/null || git add data/jobs_history.json 2>/dev/null || exit 0
          git commit -m "기록: 직업체험 쇼츠 $(date -u +%F)" || exit 0
          git pull --rebase
          git push

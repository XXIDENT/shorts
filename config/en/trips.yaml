- id: spain
  num: 6
  name: Spain
  city: Madrid
  tease: What time do people in Spain usually eat dinner? Answer at the end!
  tease_top: ["Dinner in Spain", "What time?"]
  tease_big: "?pm"
  hook: Madrid! The sun stays up forever here.
  quests:
  - title: Go to a restaurant at 7 pm
    say:
    - I'm starving! It's 7 pm, perfect dinner time. Let's go in.
    after: They're still getting ready. Dinner here starts way later.
  - title: Eat tapas at a bar
    cost: 3.5
    say:
    - While I wait, tapas at the bar! Little plates of snacks to share.
    after: Potato omelette and olives. You order a few and share them.
  - title: Ride the metro to the plaza
    cost: 1.8
    say:
    - One single metro ticket to Puerta del Sol, please!
    after: Made it! The plaza gets busier the later it gets.
  answer_say: The answer! In Spain, dinner is usually around 9 or 10 pm. Hours later than most places!
  answer_big: 9-10 pm
  answer_sub: a typical Spanish dinner time
  source: Common Spanish meal-time customs, $1 ≈ €0.87
- id: germany
  num: 7
  name: Germany
  city: Berlin
  tease: Return one empty plastic bottle in Germany. How much do you get back? Answer at the end!
  tease_top: ["One empty bottle", "How much back?"]
  tease_big: "$?"
  hook: Berlin! So many bikes everywhere.
  quests:
  - title: Walk on the red path
    say:
    - The sidewalk is narrow. That wide red path looks much better!
    after: Ring ring! The red path is a bike lane. No walking there.
  - title: Buy a pretzel at a bakery
    cost: 1.4
    say:
    - A German bakery means pretzels! One salty knot, please.

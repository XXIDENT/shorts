name: 조회수 리포트

on:
  schedule:
    - cron: "7 14 * * *"      # 매일 23:07 KST (21시 업로드 뒤). Claude 없이 리포트·편 수 점검까지 여기서 끝낸다
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: stats
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: 조회수 집계
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python -m shorts.stats

      - name: '"조회수 리포트" 이슈에 댓글 남기기'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=$(gh issue list --state open --search "조회수 리포트 in:title" --json number,title \
                --jq '[.[] | select(.title == "📊 조회수 리포트")][0].number')
          if [ -z "$N" ]; then
            N=$(gh issue create --title "📊 조회수 리포트" \
                  --body "매일 22:30(KST)에 채널 조회수를 댓글로 남깁니다. 이 이슈를 구독하면 알림으로 받을 수 있어요." \
                  | grep -o '[0-9]*$')
          fi
          gh issue comment "$N" --body-file out/views.md
          # 이슈 본문도 항상 최신 리포트로 바꿔 둔다(이슈만 열어 봐도 지금 숫자가 보이게)
          gh issue edit "$N" --body-file out/views.md

      - name: 오늘 업로드 편 수 점검 (빠지면 이슈)
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/check_uploads.py && exit 0
          gh label create upload-failure --color D93F0B --description "자동 업로드 실패" 2>/dev/null || true
          gh issue create --title "🚨 업로드 빠짐: $(TZ=Asia/Seoul date +%m/%d) KST" --body-file out/missing.md --label upload-failure

      - name: 조회수 기록 저장
        run: |
          git config user.name "shorts-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/views.json
          git commit -m "기록: 조회수 $(date -u +%F)" || exit 0
          git pull --rebase
          git push

# 'AI 신입 모니의 직업체험' 에피소드 대본.
#
# 편마다 직접 쓴다(템플릿 반복 금지: 유튜브 대량생산 콘텐츠 정책).
# - scene: shorts/pixel/scenes.py의 무대 이름
# - quests: 2~3개. say(1~2줄) → result(clear|fail) → after(결과 한 줄)
#   spot: 모니가 설 자리, pose: work|idle|wave, face: normal|focus|happy|sad|shock|smug|love|dizzy
#   fx: 진행 중 효과, fx_after: 결과 효과, props: 이 퀘스트에만 나오는 소품, npc: false면 손님 없음
# - data: Frey & Osborne(2013) 부록의 실제 확률(prob)과 원래 직업명(occupation), 화면용 이름(label)
# - verdict: 모니의 체감 대체 가능도(%), 캐릭터 의견이라고 설명에 밝힌다
# - draft: true면 아직 안 올림
episodes:
  - id: barista
    num: 1
    job: 바리스타
    scene: cafe
    data: {prob: 0.96, occupation: "Counter Attendants, Cafeteria, Food Concession and Coffee Shop", label: "커피숍 카운터 직원"}
    hook: "안녕, 난 AI 신입 모니야. 오늘은 카페에서 바리스타로 일해 볼게!"
    quests:
      - title: 아메리카노 30잔
        spot: machine
        fx: [steam]
        say: ["오픈하자마자 단체 주문, 아메리카노 서른 잔.", "원두 18그램, 추출 25초. 서른 잔 전부 오차 0초."]
        result: clear
        after: "기계랑 손발이 너무 잘 맞아. 혹시 우리 친척일까?"
      - title: 라떼아트 하트
        spot: cups
        fx: [hearts]
        say: ["다음은 라떼아트. 하트를 그려 달래.", "좌표 계산은 완벽했는데, 손목 스냅이라는 변수가 있었어."]
        result: fail
        after: "손님이 이거 혹시 감자냐고 물어봤어."
      - title: 단골의 "늘 먹던 걸로"
        spot: register
        say: ["단골손님이 늘 먹던 걸로 달래.", "주문 기록 312건 분석 끝. 오늘은 비가 오니까 따뜻한 바닐라라떼!"]
        result: clear
        after: "어떻게 알았냐고 놀라던데, 사실 나도 좀 놀랐어."
    data_face: smug
    verdict: 55
    verdict_say: "커피는 기계가 더 잘 내려. 그런데 감자 말고 하트를 그리려면 아직 사람 손이 필요해."


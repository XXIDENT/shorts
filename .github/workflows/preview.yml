name: 미리보기 영상

# 업로드 없이 음성까지 넣은 미리보기 영상을 만들어 공개 릴리스 'previews'에 올린다.
on:
  workflow_dispatch:
    inputs:
      job:
        description: "직업 id (비우면 직업체험은 건너뜀)"
        default: barista
      country:
        description: "나라 id (config/trips.yaml)"
        default: japan
      cut:
        description: "1이면 짧은 편집(25~30초)"
        default: "1"

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update -q && sudo apt-get install -y -q fonts-unifont ffmpeg
      - run: pip install -r requirements.txt
      - name: 영상 만들기 (업로드 안 함)
        env:
          SHORTS_CUT: ${{ github.event.inputs.cut }}
        run: |
          mkdir -p prev
          if [ -n "${{ github.event.inputs.job }}" ]; then python -m shorts.jobs --no-upload --job "${{ github.event.inputs.job }}" --out prev; fi
          python -m shorts.trip --no-upload --country "${{ github.event.inputs.country }}" --out prev
          ls -la prev
      - name: 릴리스 'previews'에 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view previews >/dev/null 2>&1 || gh release create previews --title "미리보기 영상" --notes "업로드 전 확인용 미리보기" --prerelease
          for f in prev/*.mp4; do
            n="preview-$(basename "$f" | sed -E 's/^[0-9-]+-//')"
            cp "$f" "$n"
            gh release upload previews "$n" --clobber
            echo "https://github.com/${{ github.repository }}/releases/download/previews/$n"
          done

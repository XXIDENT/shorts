name: 조회수 리포트

on:
  schedule:
    - cron: "30 13 * * *"     # 매일 22:30 KST (21시 업로드 뒤)
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: stats
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: 조회수 집계
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python -m shorts.stats

      - name: '"조회수 리포트" 이슈에 댓글 남기기'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=$(gh issue list --state open --search "조회수 리포트 in:title" --json number,title \
                --jq '[.[] | select(.title == "📊 조회수 리포트")][0].number')
          if [ -z "$N" ]; then
            N=$(gh issue create --title "📊 조회수 리포트" \
                  --body "매일 22:30(KST)에 채널 조회수를 댓글로 남깁니다. 이 이슈를 구독하면 알림으로 받을 수 있어요." \
                  | grep -o '[0-9]*$')
          fi
          gh issue comment "$N" --body-file out/views.md

      - name: 조회수 기록 저장
        run: |
          git config user.name "shorts-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/views.json
          git commit -m "기록: 조회수 $(date -u +%F)" || exit 0
          git pull --rebase
          git push

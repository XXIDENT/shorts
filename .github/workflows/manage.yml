name: 채널 관리

on:
  workflow_dispatch:
    inputs:
      command:
        description: "list | delete | privacy | title | clean_desc | branding | audit | fix_settings"
        required: true
        default: list
      args:
        description: "예) delete: 영상ID  /  privacy: 영상ID public  /  title: 영상ID 새 제목"
        required: false

jobs:
  manage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 실행
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          CMD: ${{ github.event.inputs.command }}
          ARGS: ${{ github.event.inputs.args }}
        run: python -m shorts.manage "$CMD" $ARGS
